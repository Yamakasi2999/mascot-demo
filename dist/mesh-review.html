<!doctype html><html lang="ru"><meta charset="utf-8"><style>body{margin:0;background:#f7f8fa;font:14px system-ui;color:#556}header{display:flex;gap:8px;padding:12px;position:sticky;top:0;background:#e9edef}canvas{display:block;width:min(800px,96vw);height:auto;margin:auto}input{width:70px}</style><header><select id="emotion" aria-label="Эмоция"><option>idle</option><option>happy</option><option>sad</option><option>sleep</option><option selected>study</option><option>wow</option><option>like</option><option>party</option><option>wave</option><option>laugh</option></select><label>Время <input id="time" aria-label="Время" type="number" value="2" step="0.1" min="0" max="4.8"></label><button id="play">Воспроизвести</button><button id="dark">Тёмный фон</button></header><canvas id="canvas" width="862" height="1030"></canvas><script src="assets/rive.js"></script><script>rive.RuntimeLoader.setWasmUrl('assets/rive.wasm');let state='study';let playing=false;const player=new rive.Rive({src:'assets/v3/mascot.riv?mesh=qa8',canvas:document.querySelector('canvas'),animations:state,autoplay:true,onLoad(){player.resizeDrawingSurfaceToCanvas();player.pause();player.scrub(state,2);document.body.dataset.ready='1';}});document.querySelector('#emotion').onchange=e=>{player.stop(state);state=e.target.value;player.play(state);if(!playing){player.pause();player.scrub(state,Number(document.querySelector('#time').value))}};document.querySelector('#time').oninput=e=>{player.pause();playing=false;player.scrub(state,Number(e.target.value))};document.querySelector('#play').onclick=()=>{playing=!playing;playing?player.play(state):player.pause();document.querySelector('#play').textContent=playing?'Пауза':'Воспроизвести'};document.querySelector('#dark').onclick=()=>document.body.style.background=document.body.style.background?'':'#34404d';</script></html>
